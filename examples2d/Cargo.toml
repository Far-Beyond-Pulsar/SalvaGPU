[package]
name = "examples2d"
version = "0.1.0"
authors = ["Sébastien Crozet <developer@crozet.re>"]
edition = "2018"

[features]
default = []
parallel = ["rapier_testbed2d/parallel"]
gpu-acceleration = ["salva2d/gpu-acceleration", "wgpu"]

[dependencies]
Inflector = "0.11"
nalgebra = "0.33"
parry2d = "0.18"
rapier2d = "0.23"
rapier_testbed2d = "0.23"
parry3d = "0.18"
bevy = "0.15"
pollster = "0.3"
instant = "0.1"
wgpu = { version = "23", optional = true }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

[dependencies.salva2d]
path = "../build/salva2d"
features = ["rapier", "rapier-testbed", "sampling"]

[target.wasm32-unknown-unknown.dependencies]
stdweb = "0.4"

[target.wasm32-unknown-emscripten.dependencies]
stdweb = "0.4"

[[bin]]
name = "all_examples2"
path = "./all_examples2.rs"

[[bin]]
name = "gpu_benchmark"
path = "./gpu_benchmark.rs"
required-features = []

[[bin]]
name = "parity_test"
path = "./parity_test.rs"
required-features = []
